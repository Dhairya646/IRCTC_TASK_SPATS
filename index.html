<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav class="navbar">
        <div class="left-image-nav">
            <img src="secondry-logo.png"></img>
        </div>
        <div class="middle-navbar">
            <div>
                <span class="time-and-date" id="time-and-date"></span>
                <span class="nav-dividor">|</span>
                <span class="dec-size">A<sup>-</sup></span>
                <span class="nav-dividor">|</span>
                <span class="same-size">A<sup> </sup></span>
                <span class="nav-dividor">|</span>
                <span class="inc-size">A<sup>+</sup></span>
                <span class="nav-dividor">|</span>
                <span class="language" id="language">English</span>
            </div>
            <div></div>
        </div>
        <div class="right-image-nav">
            <img src="logo.png" alt="">
        </div>
    </nav>

    <main>
        <div class="station-selection">
            <div class="input-container">
                <input type="text" id="fromInput" placeholder="From Station Name">
                <div id="suggestions" class="dropdown"></div>
            </div>
            <div class="input-container">
                <input type="text" id="toInput" placeholder="To Station Name">
                <div id="dropdown-to" class="dropdown"></div>
            </div>
        </div>

        <div class="journey-date">
            <input type="date" id="journeyDate" >
        </div>
    </main>
</body>
    <script src="script.js"></script>
</html>
